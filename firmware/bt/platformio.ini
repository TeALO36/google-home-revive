; GH-Revive - Bluetooth co-processor (ESP32-WROOM-32E) and the USB bridge used to flash it through the S3.
;
;   pio run -e bridge -t upload                      ; 1. S3 becomes a USB <-> UART bridge to the BT module
;   pio run -e bt -t upload --upload-port <COMx>     ; 2. flash the BT module through the bridge
;   esphome run ../s3/gh-revive.yaml                 ; 3. put the main firmware back on the S3

[platformio]
default_envs = bt

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:bt]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = +<bt/>
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git

[env:bridge]
board = esp32-s3-devkitc-1
build_src_filter = +<bridge/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
