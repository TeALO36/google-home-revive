; GH-Revive - Bluetooth co-processor (ESP32-WROOM-32E) and the bridge used to flash it through the S3.
; Everything goes through the USB-C of the main board (S3 native USB). To put the S3 in download mode, hold the
; BOOT pad TP2 on GND (TP5) while plugging the USB-C cable.
;
;   pio run -e bridge -t upload --upload-port <COMx>   ; 1. S3 in download mode: flash the bridge, replug the USB-C
;   pio run -e bt -t upload --upload-port <COMy>       ; 2. flash the BT module through the bridge (new COM port)
;   esphome run ../s3/gh-revive.yaml --device <COMx>   ; 3. S3 in download mode again: main firmware back

[platformio]
default_envs = bt

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:bt]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = +<bt/>
upload_speed = 460800
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git

[env:bridge]
board = esp32-s3-devkitc-1
build_src_filter = +<bridge/>
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
