# GH-Revive - ESP32-S3 main firmware (ESPHome).
#
#   esphome config  firmware/s3/gh-revive.yaml     # validate
#   esphome run     firmware/s3/gh-revive.yaml     # first flash through the USB-C (BOOT pad TP2 on GND while plugging), then OTA
#
# Pin map: docs/cahier_des_charges.md, section 10. Secrets: copy secrets.example.yaml to secrets.yaml.
#
# Wi-Fi: the network in secrets.yaml is tried first. If it is missing or unreachable, the access point
# "GH-Revive Setup" opens after 30 s and the speaker says so; joining it opens the setup page (admin password first,
# then network + key, tested live). Once connected, the speaker reads the IP address aloud.

substitutions:
  name: gh-revive
  friendly_name: GH Revive
  led_count: "12"
  touch_address: "0x5B"
  amp_address: "0x2C"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Same firmware for every device: the MAC suffix (gh-revive-a1b2c3) keeps names unique on the network and in HA
  name_add_mac_suffix: true
  min_version: 2025.5.0
  includes:
    - ring_gesture.h
    - ip_speech.h
    - wake_arbiter.h
  on_boot:
    - priority: 600
      then:
        - output.turn_on: bt_enable
        - output.turn_on: bt_boot
    - priority: -100
      then:
        - lambda: |-
            uint8_t mac[6];
            get_mac_address_raw(mac);
            const uint32_t device_id = (static_cast<uint32_t>(mac[3]) << 16) | (static_cast<uint32_t>(mac[4]) << 8) | mac[5];
            wake_arbiter::arbiter().set_device_id(device_id);
        - script.execute: amp_start
        - script.execute: led_idle

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG  # USB-C of the main board

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - script.execute: wake_engine_start
  on_client_disconnected:
    - voice_assistant.stop:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA  # accepts WPA, WPA2 and WPA3 networks; WEP is not supported by the ESP32 Wi-Fi stack
  ap:
    ssid: "GH-Revive Setup"
    password: !secret ap_password
    ap_timeout: 30s
  on_connect:
    - if:
        condition:
          lambda: return id(setup_portal).take_announce_request();
        then:
          - script.execute: announce_ip

captive_portal:  # DNS redirection on the access point; the pages themselves are served by gh_setup

external_components:
  - source:
      type: local
      path: components
    components: [gh_setup]

gh_setup:
  id: setup_portal
  test_timeout: 25s

# ------------------------------------------------------------------ buses

i2c:
  id: bus_i2c
  sda: GPIO16
  scl: GPIO17
  frequency: 400kHz

i2c_device:
  id: amp_i2c
  i2c_id: bus_i2c
  address: ${amp_address}

i2s_audio:
  - id: i2s_mic
    i2s_lrclk_pin: GPIO4  # PDM clock, gated by the hardware mute buffer
  - id: i2s_amp
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO9

uart:
  id: bt_uart
  tx_pin: GPIO42
  rx_pin: GPIO41
  baud_rate: 115200
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\n"
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          while (!line.empty() && (line.back() == '\n' || line.back() == '\r')) {
            line.pop_back();
          }
          if (!line.empty()) {
            id(bt_status).publish_state(line);
          }

# ------------------------------------------------------------------ audio

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO5
    channel: left  # MIC1 (SELECT = GND); MIC2 answers on the right slot
    sample_rate: 16000
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: amp_out
    i2s_audio_id: i2s_amp
    dac_type: external
    i2s_dout_pin: GPIO11
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 100ms
    timeout: never
  - platform: mixer
    id: audio_mixer
    output_speaker: amp_out
    num_channels: 2
    source_speakers:
      - id: announcement_input
        timeout: never
      - id: media_input
        timeout: never
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_input
  - platform: resampler
    id: media_resampler
    output_speaker: media_input

media_player:
  - platform: speaker
    id: player
    name: None
    volume_increment: 0.05
    volume_min: 0.0
    volume_max: 0.9
    files:  # French voice prompts, sounds/README.md
      - {id: snd_digit_0, file: sounds/digit_0.flac}
      - {id: snd_digit_1, file: sounds/digit_1.flac}
      - {id: snd_digit_2, file: sounds/digit_2.flac}
      - {id: snd_digit_3, file: sounds/digit_3.flac}
      - {id: snd_digit_4, file: sounds/digit_4.flac}
      - {id: snd_digit_5, file: sounds/digit_5.flac}
      - {id: snd_digit_6, file: sounds/digit_6.flac}
      - {id: snd_digit_7, file: sounds/digit_7.flac}
      - {id: snd_digit_8, file: sounds/digit_8.flac}
      - {id: snd_digit_9, file: sounds/digit_9.flac}
      - {id: snd_point, file: sounds/point.flac}
      - {id: snd_connected, file: sounds/connected.flac}
      - {id: snd_setup, file: sounds/setup.flac}
    announcement_pipeline:
      speaker: announcement_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampler
      format: FLAC
      num_channels: 2
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_input
          decibel_reduction: 20
          duration: 0.0s
    on_idle:
      - mixer_speaker.apply_ducking:
          id: media_input
          decibel_reduction: 0
          duration: 1.0s

micro_wake_word:
  id: mww
  microphone: mic
  stop_after_detection: false
  # Home Assistant shows a "Wake word" choice on the device page listing these models; only the first one is active
  # until another is picked there (the choice is stored on the device). Each device and the phone are set separately.
  models:
    - model: hey_jarvis
      id: jarvis_model
    - model: okay_nabu
      id: nabu_model
    - model: hey_mycroft
      id: mycroft_model
  on_wake_word_detected:
    - lambda: id(pending_wake_word) = wake_word;
    - script.execute: wake_arbitrate

# ------------------------------------------------------------------ nearest-device arbitration (wake_arbiter.h)

globals:
  - id: pending_wake_word
    type: std::string
    restore_value: false
  - id: va_active  # a request is being heard or answered (not just waiting for the wake word)
    type: bool
    restore_value: false
    initial_value: "false"

udp:
  id: arbiter_udp
  port: 18511  # broadcast on the local network; every GH-Revive listens on the same port
  on_receive:
    - lambda: |-
        wake_arbiter::Claim claim;
        if (wake_arbiter::decode(data.data(), data.size(), claim)) {
          wake_arbiter::arbiter().peer(claim, millis());
        }

sensor:
  - platform: sound_level
    microphone: mic
    passive: true  # only measures while the wake word engine already runs the microphone
    measurement_duration: 100ms
    rms:
      id: mic_level
      internal: true
      on_value:
        - lambda: wake_arbiter::loudness().add(x, millis());
  - platform: template
    id: wake_level
    name: Niveau dernier mot d'activation
    unit_of_measurement: dB
    accuracy_decimals: 1
    entity_category: diagnostic

number:
  - platform: template
    id: arbiter_window
    name: Delai d'arbitrage
    entity_category: config
    unit_of_measurement: ms
    min_value: 150
    max_value: 1500
    step: 50
    initial_value: 400
    optimistic: true
    restore_value: true
  - platform: template
    id: level_offset
    name: Correction niveau micro
    entity_category: config
    unit_of_measurement: dB
    min_value: -15
    max_value: 15
    step: 0.5
    initial_value: 0
    optimistic: true
    restore_value: true

voice_assistant:
  id: va
  microphone: mic
  media_player: player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(va_active) = true;
    - mixer_speaker.apply_ducking:
        id: media_input
        decibel_reduction: 20
        duration: 0.0s
    - light.turn_on:
        id: ring
        brightness: 60%
        red: 0%
        green: 40%
        blue: 100%
        effect: Ecoute
  on_stt_end:
    - text_sensor.template.publish:
        id: last_request
        state: !lambda return x;
  on_tts_start:
    - text_sensor.template.publish:
        id: last_answer
        state: !lambda return x;
  on_stt_vad_end:
    - light.turn_on:
        id: ring
        effect: Reflexion
  on_end:
    - lambda: id(va_active) = false;
    - wait_until:
        not:
          media_player.is_announcing: player
    - mixer_speaker.apply_ducking:
        id: media_input
        decibel_reduction: 0
        duration: 1.0s
    - script.execute: led_idle
  on_error:
    - lambda: id(va_active) = false;
    # Several devices (or the phone) heard the same wake word: Home Assistant keeps the first one that streamed and
    # answers the others with duplicate_wake_up_detected. The losers go back to idle silently.
    - if:
        condition:
          lambda: return code == "duplicate_wake_up_detected";
        then:
          - logger.log: "Wake word answered by another device"
          - script.execute: led_idle
        else:
          - light.turn_on:
              id: ring
              brightness: 60%
              red: 100%
              green: 30%
              blue: 0%
              effect: none
          - delay: 1s
          - script.execute: led_idle

# ------------------------------------------------------------------ amplifier (TAS5805M)

output:
  - platform: gpio
    id: amp_pdn
    pin: GPIO13
  - platform: gpio
    id: bt_enable  # high = Bluetooth module running (EN through R9)
    pin: GPIO2
  - platform: gpio
    id: bt_boot  # high = normal boot, low during reset = download mode
    pin: GPIO1

script:
  # Wake word detection runs either on the device (microWakeWord, nearest-device arbitration) or in Home Assistant
  # (the wake word engine of the Assist pipeline, e.g. openWakeWord: any word set in Assist, audio streamed
  # continuously to the server). Chosen with the "Detection du mot d'activation" select.
  - id: wake_engine_start
    mode: restart
    then:
      - if:
          condition:
            or:
              - binary_sensor.is_on: mute_state
              - not:
                  api.connected:
          then:
            - logger.log: "Muted or Home Assistant not connected: wake word detection waits"
          else:
            - if:
                condition:
                  lambda: return id(wake_engine).current_option() == std::string("Dans Home Assistant");
                then:
                  - micro_wake_word.stop:
                  - lambda: id(va).set_use_wake_word(true);
                  - wait_until:
                      condition:
                        not:
                          voice_assistant.is_running:
                      timeout: 2s
                  - voice_assistant.start_continuous:
                else:
                  - lambda: id(va).set_use_wake_word(false);
                  - micro_wake_word.start:

  - id: wake_engine_stop
    mode: restart
    then:
      - lambda: id(va_active) = false;
      - micro_wake_word.stop:
      - voice_assistant.stop:

  - id: wake_engine_restart
    mode: restart
    then:
      - script.execute: wake_engine_stop
      - delay: 300ms
      - script.execute: wake_engine_start
      - script.execute: led_idle

  # Every speaker that heard the wake word broadcasts how loud it heard it, waits for the others, and only the
  # loudest one starts the pipeline. The wait also leaves a phone that heard the wake word time to win.
  - id: wake_arbitrate
    mode: restart
    then:
      - lambda: |-
          const uint32_t now = millis();
          const float level = wake_arbiter::loudness().recent_max(now) + id(level_offset).state;
          const wake_arbiter::Claim claim = wake_arbiter::arbiter().claim(level, now);
          id(wake_level).publish_state(claim.level_ddb / 10.0f);
      - udp.write:
          id: arbiter_udp
          data: !lambda return wake_arbiter::encode(wake_arbiter::arbiter().last_claim());
      - delay: 40ms
      - udp.write:
          id: arbiter_udp
          data: !lambda return wake_arbiter::encode(wake_arbiter::arbiter().last_claim());
      - wait_until:
          condition:
            lambda: return wake_arbiter::arbiter().already_lost(millis());
          timeout: !lambda return static_cast<uint32_t>(id(arbiter_window).state);
      - if:
          condition:
            lambda: return wake_arbiter::arbiter().decide(millis()) == wake_arbiter::Verdict::Won;
          then:
            - voice_assistant.start:
                wake_word: !lambda return id(pending_wake_word);
          else:
            - logger.log: "Wake word left to a closer device"

  - id: amp_start
    mode: restart
    then:
      - output.turn_off: amp_pdn
      - delay: 10ms
      - output.turn_on: amp_pdn
      - delay: 10ms
      - lambda: |-
          // page 0 / book 0, Hi-Z, 0 dB digital volume, then Play (TAS5805M datasheet, startup procedure)
          const uint8_t sequence[][2] = {{0x00, 0x00}, {0x7F, 0x00}, {0x03, 0x02}, {0x4C, 0x30}, {0x54, 0x00}};
          for (const auto &reg : sequence) {
            if (!id(amp_i2c).write_byte(reg[0], reg[1])) {
              ESP_LOGE("amp", "TAS5805M write 0x%02X failed (address ${amp_address})", reg[0]);
              return;
            }
          }
      - delay: 5ms
      - lambda: |-
          if (!id(amp_i2c).write_byte(0x03, 0x03) || !id(amp_i2c).write_byte(0x78, 0x80)) {
            ESP_LOGE("amp", "TAS5805M play / fault clear failed");
          }

  # ---------------------------------------------------------------- voice prompts
  - id: announce_ip
    mode: single
    then:
      - delay: 2s  # amplifier started, DHCP settled
      - lambda: |-
          const std::string ip = id(setup_portal).station_ip();
          if (ip.empty()) {
            ESP_LOGW("announce", "No IP address to announce");
            return;
          }
          ESP_LOGI("announce", "Speaking IP address %s", ip.c_str());
          const ip_speech::Clips clips = {{id(snd_digit_0), id(snd_digit_1), id(snd_digit_2), id(snd_digit_3),
                                           id(snd_digit_4), id(snd_digit_5), id(snd_digit_6), id(snd_digit_7),
                                           id(snd_digit_8), id(snd_digit_9)}, id(snd_point)};
          id(player).play_file(id(snd_connected), true, true);
          for (const audio::AudioFile *clip : ip_speech::sequence(ip, clips)) {
            id(player).play_file(clip, true, true);
          }

  # ---------------------------------------------------------------- LED ring
  - id: led_idle
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: mute_state
          then:
            - light.turn_on:
                id: ring
                brightness: 40%
                red: 100%
                green: 0%
                blue: 0%
                effect: none
          else:
            - light.turn_off: ring

  - id: led_volume
    mode: restart
    then:
      - light.turn_on:
          id: ring
          brightness: 50%
          red: 0%
          green: 0%
          blue: 0%
          effect: none
      - light.addressable_set:
          id: ring
          range_from: 0
          range_to: !lambda |-
            const int lit = static_cast<int>(roundf(id(player).volume * ${led_count}));
            return std::max(0, std::min(${led_count} - 1, lit - 1));
          red: 100%
          green: 100%
          blue: 100%
      - delay: 1500ms
      - script.execute: led_idle

  # ---------------------------------------------------------------- touch ring
  - id: ring_input
    mode: queued
    max_runs: 20
    parameters:
      sector: int
      pressed: bool
    then:
      - lambda: |-
          const uint32_t now = millis();
          const ring_gesture::Event event = pressed ? ring_gesture::decoder().press(sector, now)
                                            : ring_gesture::decoder().release(sector, now);
          if (event != ring_gesture::Event::None) {
            if (ring_gesture::dedup().accept(event, millis())) {
              id(ring_event)->execute(static_cast<int>(event));
            }
          }

  - id: ring_event
    mode: queued
    max_runs: 10
    parameters:
      code: int
    then:
      - if:
          condition:
            lambda: return code == static_cast<int>(ring_gesture::Event::VolumeUp);
          then:
            - media_player.volume_up: player
            - script.execute: led_volume
      - if:
          condition:
            lambda: return code == static_cast<int>(ring_gesture::Event::VolumeDown);
          then:
            - media_player.volume_down: player
            - script.execute: led_volume
      - if:
          condition:
            lambda: return code == static_cast<int>(ring_gesture::Event::Tap);
          then:
            - if:
                condition:
                  lambda: return id(va_active);
                then:
                  - script.execute: wake_engine_restart
                else:
                  - media_player.toggle: player
                  - homeassistant.event:
                      event: esphome.gh_revive_gesture
                      data:
                        gesture: tap
      - if:
          condition:
            lambda: return code == static_cast<int>(ring_gesture::Event::DoubleTap);
          then:
            - homeassistant.event:
                event: esphome.gh_revive_gesture
                data:
                  gesture: double_tap

interval:
  - interval: 50ms
    then:
      - lambda: |-
          const ring_gesture::Event event = ring_gesture::decoder().poll(millis());
          if (event != ring_gesture::Event::None) {
            if (ring_gesture::dedup().accept(event, millis())) {
              id(ring_event)->execute(static_cast<int>(event));
            }
          }
  - interval: 60s  # setup mode: say how to reach the setup page
    then:
      - if:
          condition:
            lambda: return id(setup_portal).ap_active();
          then:
            - media_player.speaker.play_on_device_media_file:
                id: player
                media_file: snd_setup
                announcement: true

mpr121:
  id: touch
  i2c_id: bus_i2c
  address: ${touch_address}
  touch_debounce: 1
  release_debounce: 1
  touch_threshold: 10  # tuned through the plastic: lower = more sensitive
  release_threshold: 6

light:
  - platform: esp32_rmt_led_strip
    id: ring
    name: Anneau
    pin: GPIO6
    num_leds: ${led_count}
    rgb_order: GRB
    chipset: WS2812
    color_correct: [50%, 50%, 50%]  # 12 LEDs at full white = 0.2 A on the +5V link wire
    default_transition_length: 200ms
    effects:
      - addressable_scan:
          name: Ecoute
          move_interval: 60ms
          scan_width: 3
      - pulse:
          name: Reflexion
          transition_length: 400ms
          update_interval: 400ms
      # RGB animations, selectable from Home Assistant (each of the 12 LEDs has its own 24-bit colour)
      - addressable_rainbow:
          name: Arc-en-ciel
          speed: 10
          width: 12
      - addressable_color_wipe:
          name: Balayage couleurs
      - addressable_scan:
          name: Comete
          move_interval: 80ms
          scan_width: 2
      - addressable_twinkle:
          name: Scintillement
      - addressable_fireworks:
          name: Feu d'artifice
      - addressable_flicker:
          name: Bougie

# ------------------------------------------------------------------ sensors and controls

binary_sensor:
  - platform: gpio
    id: mute_state
    name: Micros coupes
    pin: GPIO7  # 1 = muted by the hardware switch (PDM clock gated)
    on_press:
      - script.execute: wake_engine_stop
      - script.execute: led_idle
    on_release:
      - script.execute: wake_engine_start
      - script.execute: led_idle
  - platform: gpio
    id: amp_fault
    name: Defaut ampli
    entity_category: diagnostic
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true  # FAULTZ is open drain, active low
    on_press:
      - logger.log:
          level: ERROR
          format: "TAS5805M fault, restarting the amplifier"
      - script.execute: amp_start
  - platform: gpio
    id: bt_connected
    name: Bluetooth connecte
    pin: GPIO21  # IO22 of the Bluetooth module, high while an A2DP source is connected
  - platform: mpr121
    id: sector_0
    channel: 0
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 0, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 0, pressed: false}}]
  - platform: mpr121
    id: sector_1
    channel: 1
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 1, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 1, pressed: false}}]
  - platform: mpr121
    id: sector_2
    channel: 2
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 2, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 2, pressed: false}}]
  - platform: mpr121
    id: sector_3
    channel: 3
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 3, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 3, pressed: false}}]
  - platform: mpr121
    id: sector_4
    channel: 4
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 4, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 4, pressed: false}}]
  - platform: mpr121
    id: sector_5
    channel: 5
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 5, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 5, pressed: false}}]
  - platform: mpr121
    id: sector_6
    channel: 6
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 6, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 6, pressed: false}}]
  - platform: mpr121
    id: sector_7
    channel: 7
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 7, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 7, pressed: false}}]
  - platform: mpr121
    id: sector_8
    channel: 8
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 8, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 8, pressed: false}}]
  - platform: mpr121
    id: sector_9
    channel: 9
    internal: true
    on_press: [{script.execute: {id: ring_input, sector: 9, pressed: true}}]
    on_release: [{script.execute: {id: ring_input, sector: 9, pressed: false}}]
  - platform: mpr121
    id: centre_button  # round electrode inside the LED ring
    channel: 10
    internal: true
    on_multi_click:
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.35s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              if (ring_gesture::dedup().accept(ring_gesture::Event::DoubleTap, millis())) {
                id(ring_event)->execute(static_cast<int>(ring_gesture::Event::DoubleTap));
              }
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.35s
        then:
          - lambda: |-
              if (ring_gesture::dedup().accept(ring_gesture::Event::Tap, millis())) {
                id(ring_event)->execute(static_cast<int>(ring_gesture::Event::Tap));
              }

select:
  - platform: template
    id: wake_engine
    name: Detection du mot d'activation
    entity_category: config
    options: ["Sur l'appareil", "Dans Home Assistant"]
    initial_option: "Sur l'appareil"
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: wake_engine_restart
  # With several devices in the house, lowering the sensitivity of the one that answers too often from afar
  # lets the closest device win the wake word.
  - platform: template
    id: wake_sensitivity
    name: Sensibilite mot d'activation
    entity_category: config
    options: [Faible, Normale, Forte]
    initial_option: Normale
    optimistic: true
    restore_value: true
    on_value:
      - lambda: |-
          for (auto *model : {id(jarvis_model), id(nabu_model), id(mycroft_model)}) {
            const uint8_t base = model->get_default_probability_cutoff();
            uint8_t cutoff = base;  // "Normale": model default
            if (x == "Faible") {
              cutoff = static_cast<uint8_t>(base + (255 - base) / 2);  // stricter: needs a clearer wake word
            } else if (x == "Forte") {
              cutoff = static_cast<uint8_t>(base > 25 ? base - 25 : 0);
            }
            model->set_probability_cutoff(cutoff);
            ESP_LOGI("wake", "Wake word sensitivity %s (cutoff %u / 255)", x.c_str(), cutoff);
          }

switch:
  - platform: gpio
    id: mute_force
    name: Forcer la coupure micros
    pin:
      number: GPIO15
      inverted: true  # MUTE_SET_N, active low
    restore_mode: ALWAYS_OFF

text_sensor:
  # What the speaker understood and answered, readable in the HA app (device page or a dashboard card)
  - platform: template
    id: last_request
    name: Derniere demande
  - platform: template
    id: last_answer
    name: Derniere reponse
  - platform: template
    id: bt_status
    name: Bluetooth etat
    entity_category: diagnostic

button:
  - platform: template
    name: Appairage Bluetooth
    on_press:
      - uart.write:
          id: bt_uart
          data: "PAIR\n"
  - platform: template
    name: Redemarrer module Bluetooth
    entity_category: config
    on_press:
      - output.turn_on: bt_boot
      - output.turn_off: bt_enable
      - delay: 50ms
      - output.turn_on: bt_enable
  - platform: template
    name: Annoncer l'adresse IP
    on_press:
      - script.execute: announce_ip
  - platform: restart
    name: Redemarrer
    entity_category: config
